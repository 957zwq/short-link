<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链接不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            margin: 20px;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .short-url {
            color: #667eea;
            font-weight: bold;
            word-break: break-all;
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 18px;
        }
        
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .reasons {
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .reasons h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .reasons ul {
            list-style: none;
            padding-left: 0;
        }
        
        .reasons li {
            color: #666;
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .reasons li:before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            position: absolute;
            left: 5px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">😕</div>
        <h1>短链接无法访问</h1>
        <div class="short-url" th:text="${shortUrl}">example.com/abc123</div>
        <p>抱歉，您访问的短链接不存在或已无法使用</p>
        
        <div class="reasons">
            <h3>可能的原因：</h3>
            <ul>
                <li>短链接已过期</li>
                <li>短链接已被删除</li>
                <li>短链接从未被创建</li>
                <li>链接地址输入错误</li>
            </ul>
        </div>
        
        <div>
            <a href="/" class="btn btn-primary">返回首页</a>
            <a href="javascript:history.back()" class="btn btn-secondary">返回上一页</a>
        </div>
        
        <div class="footer">
            <p>ShortLink 短链接服务</p>
        </div>
    </div>
</body>
</html>
